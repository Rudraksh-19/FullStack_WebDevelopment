<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Table</title>
</head>
<body>
    <h1>Advance Table Example :-</h1>
    <table border="1">
        <tr>
            <td rowspan="3">Day</td>
            <td colspan="2">Seminar</td>
            <td rowspan="3">Topic</td>
        </tr>
        <tr>
            <td colspan="2">Schedule</td>
        </tr>
        <tr>
            <td>Begin</td>
            <td>End</td>
        </tr>
        <tr>
            <td rowspan="2">Monday</td>
            <td rowspan="2">8 am</td>
            <td rowspan="2">5 pm</td>
            <td>Introduction to XML</td>
        </tr>
        <tr>
            
            <td>Validity: DTD and Relax NG</td>
        </tr>
        <tr>
            <td rowspan="3">Tuesday</td>
            <td>8 am</td>
            <td>11 am</td>
            <td rowspan="2">XPath</td>
        </tr>
        <tr>
            <td>11 am</td>
            <td>2 pm</td>
        </tr>
        <tr>
            <td>2 pm</td>
            <td>5 pm</td>
            <td>XSL Transformation</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>8 am</td>
            <td>12 pm</td>
            <td>XSL Formatting Objects</td>
        </tr>
    </table>
</body>
</html>
